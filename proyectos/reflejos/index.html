<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="reflexTitle">Prueba de reflejos</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("portfolio-theme");
      document.documentElement.dataset.bsTheme = savedTheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      const savedLanguage = localStorage.getItem("portfolio-language");
      document.documentElement.lang = savedLanguage || (navigator.language.toLowerCase().startsWith("es") ? "es" : "en");
    })();
  </script>
  <link rel="stylesheet" href="../../css/project.css">
</head>
<body>
  <header class="project-header">
    <a class="project-back" href="../../index.html#proyectos" data-i18n="backPortfolio">← Volver al portafolio</a>
    <div class="project-tools">
      <div class="project-language" role="group" aria-label="Idioma">
        <button class="active" type="button" data-language="es" aria-pressed="true">ES</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" data-i18n-aria-label="themeToggle">
        <span id="theme-icon" aria-hidden="true">☀️</span>
      </button>
    </div>
  </header>
  <main class="project-shell">
    <p class="project-eyebrow" data-i18n="reflexEyebrow">Minijuego</p>
    <h1 data-i18n="reflexTitle">Prueba de reflejos</h1>
    <p class="project-description" data-i18n="reflexDescription">Iniciá la prueba y esperá a que la señal cambie. Tocá el área verde lo más rápido posible.</p>
    <section class="project-panel">
      <div class="reaction-area" id="reaction-area">
        <button class="reaction-target" id="reaction-target" type="button" disabled data-i18n="reflexReady">Presioná “Iniciar prueba” cuando estés listo.</button>
      </div>
      <div class="reaction-controls">
        <button class="project-button" id="start-test" type="button" data-i18n="reflexStart">Iniciar prueba</button>
        <p class="reaction-best"><span data-i18n="reflexBest">Mejor tiempo</span>: <strong id="best-time" data-i18n="reflexNoBest">Todavía no hay marca</strong></p>
      </div>
      <p class="project-message" id="reaction-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="project-footer" data-i18n="footerNote">Proyecto de práctica personal. Funciona directamente en el navegador; no envía datos.</footer>
  <script src="../../js/project-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
